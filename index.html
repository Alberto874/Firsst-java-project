<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <title>Mini Projects - Intro to JS</title>
<link rel="stylesheet" href="egg.css">
</head>
<body>


    <div class="container py-4">
        <h1 class="text-center mb-4">Mini Projects - Intro to JS</h1>
        <div class="row g-4">


            <!-- Tip Calculator: subTotal, percentage, tipAmount, totalBill -->
            <div class="col-12 col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h2 class="h4 mb-0">Tip Calculator</h2>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="subTotalInput" class="form-label">Subtotal ($)</label>
                            <input type="number" class="form-control" id="subTotalInput" min="0" step="0.01" placeholder="67.72">
                        </div>
                        <div class="mb-3">
                            <label for="percentageInput" class="form-label">Tip Percentage (as decimal, e.g. 0.2)</label>
                            <input type="number" class="form-control" id="percentageInput" min="0" step="0.01" placeholder="0.2">
                        </div>
                        <button type="button" class="btn btn-primary" id="tipButton">Calculate Tip</button>
                    </div>
                    <div class="card-footer">
                        <p class="mb-1">Tip Amount: <strong id="tipAmountOutput">--</strong></p>
                        <p class="mb-0">Total Bill: <strong id="totalBillOutput">--</strong></p>
                    </div>
                </div>
            </div>


            <!-- Paycheck Calculator: hoursWorked, hourlyRate, paycheckAmount -->
            <div class="col-12 col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h2 class="h4 mb-0">Paycheck Calculator</h2>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="hoursWorkedInput" class="form-label">Hours Worked</label>
                            <input type="number" class="form-control" id="hoursWorkedInput" min="0" step="0.25" placeholder="40">
                        </div>
                        <div class="mb-3">
                            <label for="hourlyRateInput" class="form-label">Hourly Rate ($)</label>
                            <input type="number" class="form-control" id="hourlyRateInput" min="0" step="0.01" placeholder="15.92">
                        </div>
                        <button type="button" class="btn btn-success" id="paycheckButton">Calculate Paycheck</button>
                    </div>
                    <div class="card-footer">
                        <p class="mb-0">Paycheck Amount: <strong id="paycheckAmountOutput">--</strong></p>
                    </div>
                </div>
            </div>


            <!-- Grade Calculator: pointsEarned, totalPoints, percentGrade -->
            <div class="col-12 col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-warning">
                        <h2 class="h4 mb-0">Grade Calculator</h2>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="pointsEarnedInput" class="form-label">Points Earned</label>
                            <input type="number" class="form-control" id="pointsEarnedInput" min="0" step="any" placeholder="50">
                        </div>
                        <div class="mb-3">
                            <label for="totalPointsInput" class="form-label">Total Points</label>
                            <input type="number" class="form-control" id="totalPointsInput" min="0" step="any" placeholder="100">
                        </div>
                        <button type="button" class="btn btn-warning" id="gradeButton">Calculate Grade</button>
                    </div>
                    <div class="card-footer">
                        <p class="mb-0">Your Grade: <strong id="percentGradeOutput">--</strong></p>
                    </div>
                </div>
            </div>


            <!-- Gas Cost Calculator: tankGallons, perGallon, gasCost -->
            <div class="col-12 col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-danger text-white">
                        <h2 class="h4 mb-0">Gas Cost Calculator</h2>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="tankGallonsInput" class="form-label">Tank Size (gallons)</label>
                            <input type="number" class="form-control" id="tankGallonsInput" min="0" step="0.1" placeholder="15.3">
                        </div>
                        <div class="mb-3">
                            <label for="perGallonInput" class="form-label">Price per Gallon ($)</label>
                            <input type="number" class="form-control" id="perGallonInput" min="0" step="0.01" placeholder="4.20">
                        </div>
                        <button type="button" class="btn btn-danger" id="gasButton">Calculate Gas Cost</button>
                    </div>
                    <div class="card-footer">
                        <p class="mb-0">Cost to Fill Up: <strong id="gasCostOutput">--</strong></p>
                    </div>
                </div>
            </div>
            <!--Random dice Roll -->
            <div class="col-12 col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-purple text-white">
                        <h2 class="h4 mb-0">Dice roll</h2>
                    </div>
                    <div class="card-body text-center">
                        <button type="button" class="btn btn-purple" id="diceButton">Roll Dice</button>
                    </div>
                    <div class="card-footer">
                        <p class="mb-0">You Rolled: <strong id="diceOutput">--</strong></p>
                    </div>
                </div>
            </div>

            <!--Username generator-->
            <div class="col-12 col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-orange text-white">
                        <h2 class="h4 mb-0">Username Generator</h2>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="firstUserInput" class="form-label">Username</label>
                            <input type="text" class="form-control" id="firstUserInput" min="0" step="0.01" placeholder="Bob">
                        </div>
                        <div class="mb-3">
                            <label for="favoriteGameInput" class="form-label">Favorite Game</label>
                            <input type="text" class="form-control" id="favoriteGameInput" min="0" step="0.01" placeholder="Fortnite">
                        </div>
                        <button type="button" class="btn btn-orange" id="usernameButton">Username</button>
                    </div>
                    <div class="card-footer">
                        <p class="mb-0">Username: <strong id="userOutput">--</strong></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/java.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"crossorigin="anonymous"></script>
</body>
</html>
